name: CI

# Code-health gate, fully independent of Azure/deploy. Runs on every push and
# PR to main: lint (maintained modules), import smoke, and the test suite.
# Deploy (deploy-azure-container-apps.yml) only runs after this workflow
# concludes successfully on main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff — maintained modules (blocking)
        run: |
          ruff check \
            src/temporal src/analysis src/metrics src/validation \
            src/config/logging_setup.py src/config/run_context.py \
            src/platform/provenance.py src/platform/views.py \
            src/platform/satellite_trends.py src/platform/charts.py \
            src/risk_engine/baselines.py \
            src/persistence tests/persistence \
            src/api/v2 tests/integration/test_api_v2_read.py \
            tests/integration/test_api_v2_alerts.py \
            tests/integration/test_api_v2_lifecycle.py \
            tests/integration/test_api_v2_field_verifications.py \
            tests/integration/test_api_v2_audit_log.py \
            tests/integration/test_api_v2_auth.py \
            tests/integration/test_api_v2_authz.py \
            tests/integration/test_api_v2_territories.py \
            tests/unit/test_api_v2_geometry.py \
            src/ui/services src/ui/tabs/tab_urgent_actions.py \
            tests/ui tests/integration/test_urgent_actions_tab.py \
            src/socioeconomic src/reporting \
            src/forecasting tests/unit/test_forecasting_projection.py \
            tests/unit/test_forecasting_seasonal.py \
            src/ui/tabs/tab_forecast.py tests/unit/test_forecast_chart.py \
            src/mobility etl_mobility.py tests/unit/test_mobility.py \
            src/platform/lac_ros.py src/platform/pressure_capacity.py \
            tests/unit/test_lac_ros.py tests/unit/test_pressure_capacity.py \
            src/spatial_causality/zone_loader.py \
            src/spatial_causality/__init__.py tests/unit/test_scm_real_zones.py \
            src/socioeconomic/series.py tests/unit/test_socio_series.py \
            src/ui/services/field_agreement.py tests/persistence/test_field_agreement.py \
            src/ui/tabs/tab_reports.py tests/unit/test_cets_readiness.py \
            tests/test_evidence_claims_sync.py tests/unit/test_prug_monitoring.py \
            scripts/build_dossier.py tests/unit/test_institutional_dossier.py \
            scripts/export_openapi.py tests/unit/test_openapi_contract.py \
            tests/unit/test_pilot_package.py tests/unit/test_dashboard_kpis_empty.py \
            src/integrations tests/unit/test_earth_engine_client.py \
            tests/unit/test_change_collections.py tests/unit/test_change_composites.py \
            tests/unit/test_change_quality.py tests/unit/test_change_models.py \
            tests/unit/test_change_render.py \
            src/services src/ui/tabs/tab_change_explorer.py \
            tests/unit/test_change_explorer_service.py \
            tests/unit/test_change_explorer_cache.py \
            tests/ui/test_change_explorer_tab.py \
            scripts/smoke_test_change_explorer_live.py \
            tests/unit/test_change_animation.py tests/unit/test_change_video.py \
            tests/unit/test_change_animation_service.py \
            tests/unit/test_change_animation_cache.py \
            scripts/smoke_test_change_animation_live.py \
            tests/live tests/unit/test_smoke_script.py \
            experiments/vis001_madrid_counting tests/unit/test_vis001_metrics.py \
            tests/unit/test_vis001_manifest.py \
            tests/unit/test_vis001_annotations.py \
            tests/unit/test_vis001_gate.py \
            tests/unit/test_vis001_reporting.py \
            tests/unit/test_vis001_preregistration.py \
            tests/unit/test_vis001_inference_adapter.py \
            tests/unit/test_vis001_cameras.py \
            tests/unit/test_vis001_structural_gates.py
      - name: Ruff — full repo (report-only, lint debt)
        continue-on-error: true
        run: ruff check src tests *.py --output-format=github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
      - name: Import smoke (core packages)
        run: |
          python -c "import src.temporal, src.analysis, src.metrics"
          python -c "import src.platform.provenance, src.risk_engine.baselines"
          python -c "import src.config.logging_setup, src.config.run_context"
      - name: Syntax smoke (entry points)
        run: python -m py_compile app.py run_pipeline_a_timeseries.py calculate_delta_ehs.py
      - name: Run test suite (coverage gate)
        # Gate de cobertura (v2.1, plan_v3_roadmap.md): el total actual es ~83%;
        # el umbral 80 bloquea regresiones grandes sin volver frágil el CI.
        run: python -m pytest -q --cov=src --cov-report=term --cov-fail-under=80
      - name: Check README version in sync with pyproject.toml
        run: python scripts/sync_readme.py --check-version
      - name: Check institutional dossier figures match live data
        # El dossier sale a la Dirección del Parque y a EUROPARC: sus cifras no
        # pueden desviarse del sistema que describen (v3.0, productización).
        run: python scripts/build_dossier.py --check
      - name: Check published OpenAPI contract matches the API
        # Un socio integra contra docs/api/openapi.json: no puede describir una
        # API que el código ya no implementa (ADR-008).
        run: python scripts/export_openapi.py --check

  typecheck:
    # Report-only (misma filosofía que el ruff full-repo): el núcleo tipado
    # tiene ~110 errores mypy --strict pendientes; se promociona a bloqueante
    # cuando se salden (ítem "CI hardening" de v2.1, plan_v3_roadmap.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies + mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install mypy
      - name: mypy — typed core (report-only)
        continue-on-error: true
        run: python -m mypy src/persistence src/api/v2 src/config

  postgres-integration:
    # La suite de persistencia contra un Postgres real (el motor de producción
    # desde el cutover ADR-011 §4bis), no solo SQLite en memoria.
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS image (not plain postgres:16) so the v3.0 spatial tests
        # (ST_DWithin / ST_Intersects on managed_assets.geom) actually run
        # instead of skipping. The migration CREATE EXTENSION postgis needs it.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: snto
          POSTGRES_PASSWORD: snto
          POSTGRES_DB: snto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Persistence suite against real Postgres
        env:
          SNTO_TEST_DATABASE_URL: postgresql+psycopg2://snto:snto@localhost:5432/snto_test
        run: python -m pytest tests/persistence -q
