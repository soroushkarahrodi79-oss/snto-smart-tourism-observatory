# SNTO · Registro de items ArcGIS — PLANTILLA DE EJEMPLO
# =====================================================================
# Fase 2A · SOLO PLACEHOLDERS. No contiene Item IDs reales, URLs reales,
# credenciales, tokens, cookies ni secretos.
#
# Los Item IDs son IDENTIFICADORES, no credenciales. Aun así, NO se registran
# valores reales hasta que el propietario lo apruebe explícitamente. Cuando se
# aprueben, cópiese este archivo a un registro NO versionado (p. ej.
# item-registry.local.yaml). Antes de crearlo, añádase ese nombre a .gitignore;
# hoy no existe esa regla. Este archivo .example permanece con placeholders.
#
# NUNCA guardar aquí ni en el registro local: contraseñas, tokens de acceso,
# API keys, client secrets, cookies de sesión.
# =====================================================================

